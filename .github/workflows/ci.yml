name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PROMOTION_JAVA_VERSION: '21.0.12+8.0.LTS'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out add-on
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out exact BlueMap backport
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jan-guenter/BlueMap
          ref: "9be321df995a1103808621d529eb72773e719d4d"
          path: .ci/bluemap
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact detached BlueMap identities
        run: |
          test "$(git -C .ci/bluemap rev-parse --abbrev-ref HEAD)" = "HEAD"
          test "$(git -C .ci/bluemap rev-parse HEAD)" = \
            "9be321df995a1103808621d529eb72773e719d4d"
          test "$(git -C .ci/bluemap/api rev-parse HEAD)" = \
            "285c9a60eff3ac2b0cab308ce1058d1565be0971"

      - name: Set up exact promotion Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ env.PROMOTION_JAVA_VERSION }}

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: '9.6.1'
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          validate-wrappers: true

      - name: Acquire exact ephemeral candidate inputs
        run: |
          input_dir="${RUNNER_TEMP}/exact-inputs"
          mkdir -p "${input_dir}"
                    curl --fail --location --retry 3 --retry-all-errors \
            --output "${input_dir}/tempad-1.21.1-3.0.4-all.jar" \
            "https://www.curseforge.com/api/v1/mods/514923/files/6517779/download"
          test "$(stat -c %s "${input_dir}/tempad-1.21.1-3.0.4-all.jar")" -eq 1696464
          sha256sum --check <<SHA256SUMS
          932dd8a1cbb86d7632330ee3b9da43211b7c7a2fb6246443fd8207f74a74eba3  ${input_dir}/tempad-1.21.1-3.0.4-all.jar
          SHA256SUMS

      - name: Read project version
        id: version
        run: |
          version="$(sed -n 's/^addon_version=//p' gradle.properties)"
          test -n "${version}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          if [[ "${version}" == *-SNAPSHOT ]]; then
            echo "release_candidate=false" >> "${GITHUB_OUTPUT}"
          else
            echo "release_candidate=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Verify prototype
        if: steps.version.outputs.release_candidate == 'false'
        run: |
          input_dir="${RUNNER_TEMP}/exact-inputs"
          : "${input_dir}"
          gradle --no-daemon \
            -PbluemapSourcePath=.ci/bluemap \
                      -PtempadJar="${input_dir}/tempad-1.21.1-3.0.4-all.jar" \
            clean prototypeCheck build

      - name: Verify reviewed release candidate
        if: steps.version.outputs.release_candidate == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          input_dir="${RUNNER_TEMP}/exact-inputs"
          : "${input_dir}"
          gradle --no-daemon \
            -PbluemapSourcePath=.ci/bluemap \
                      -PtempadJar="${input_dir}/tempad-1.21.1-3.0.4-all.jar" \
            "-PreleaseTag=v${VERSION}" \
            clean build generatePomFileForAddonPublication \
            generateMetadataFileForAddonPublication verifyReleaseCandidate

      - name: Upload review outputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "bluemap-tempad-addon-${{ github.sha }}"
          path: |
            build/libs/*.jar
            build/publications/addon/pom-default.xml
            build/publications/addon/module.json
            build/reports/**
          if-no-files-found: error
          retention-days: 14
